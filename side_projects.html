<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Side Projects - Abbey Pi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      background: #ffffff; 
    }
    .logo {
      font-family: Bahnschrift;
      font-size: 3rem;
      font-weight: 200;
      letter-spacing: 0.05em;
      text-transform: none;
      color: #424d48;
      text-decoration: none;
    }
    nav { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 2.5rem 4rem; 
      gap: 2.5rem; 
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
    }
    nav a { 
      text-decoration: none; 
      color: #000000; 
      font-size: 0.85rem; 
      text-transform: uppercase; 
      letter-spacing: 0.15em; 
    }
    .grid-container { 
      display: grid; 
      grid-template-columns: 1fr 240px; 
      gap: 5rem; 
      max-width: none; 
      margin: 5rem auto; 
      padding: 0 4rem; 
    }
    
    /* Main Page Title Styling */
    .left-pane h1 { 
      font-family: Bahnschrift;
      font-size: 5rem; 
      color: #424d48; 
      font-weight: 400; 
      margin-top: 0;
      margin-bottom: 3rem; 
    }

    /* Sub-headings (like Paintings, Art, etc.) */
    .left-pane h2 {
      font-family: Bahnschrift, -apple-system, sans-serif;
      font-size: 2rem;
      color: #424d48;
      font-weight: 400;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    .left-pane p { 
      color: #424d48; 
      font-size: 0.95rem; 
      line-height: 1.6; 
    }
    .right-column { 
      display: flex; 
      flex-direction: column; 
      gap: 1rem; 
    }
    /* The main layout container for your art pieces */
    .gallery-grid {
      display: flex;
      flex-wrap: wrap;      /* Allows items to wrap to a new row if screen is narrow */
      gap: 15rem;            /* Generous breathing room between art pieces */
      margin-top: 5rem;
    }

    /* Individual wrapper for each painting + caption pair */
    .gallery-item {
      margin: 0;            /* Resets default browser figure margins */
      display: flex;
      flex-direction: column;
      max-width: 400px;     /* Sets a consistent max width for your display size */
    }

    /* Image constraints */
    .gallery-item img {
      width: 100%;
      height: auto;         /* Maintains original aspect ratio perfectly */
      border-radius: 4px;   /* Optional: a tiny roundness to fit the clean style */
      display: block;
    }

    /* The artwork titles underneath */
    .gallery-item figcaption {
      margin-top: 0.8rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.9rem;
      color: #424d48;       /* Matches your signature gray */
      letter-spacing: 0.02em;
      font-weight: 300;     /* Keeps the caption light and un-cluttered */
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">abbey&pi;</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="synth_design.html">Synth Design</a>
      <a href="dsp.html">DSP</a>
      <a href="side_projects.html">Side Projects</a>
      <a href="about.html">about</a>
    </div>
  </nav>

  <div class="grid-container">
    <div class="left-pane">
      <h1>Side Projects</h1>
      
      
      <h2>Paintings</h2>
      
      <div class="gallery-grid">
        
        <figure class="gallery-item">
          <img src="images/painting1.png" alt="Title of First Painting">
          <figcaption>'Gazer I' (2025)</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/painting2.png" alt="Title of Second Painting">
          <figcaption>'Gazer II' (2025)</figcaption>
        </figure>

        

      </div>
    </div>
    
    <div class="right-column">
      </div>
  </div>

</body>
</html>
